{% extends "base.html" %}
{% block content %}

<!-- Result Section -->
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow border-0 p-4 text-center" data-aos="fade-up">
          <h2 class="fw-bold text-success mb-4">Prediction Result</h2>
          <div class="mb-3">
            <img src="{{ url_for('static', filename='uploads/' + filename) }}"
                 alt="Uploaded Image" class="img-fluid rounded shadow mb-3" style="max-width: 400px;">
          </div>
          <p class="fs-5"><strong>Class:</strong> {{ label }}</p>
          <p class="fs-5"><strong>Confidence:</strong> {{ confidence }}%</p>
          {% if requires_weight %}
          <div class="mt-4">
            <label for="weight-input" class="form-label fs-5"><strong>Enter the weight of the item (in grams):</strong></label>
            <input type="number" id="weight-input" class="form-control mb-3" min="0" step="0.1" required>
            <button id="submit-weight" class="btn btn-warning btn-lg">Submit Weight</button>
          </div>
          {% endif %}
          <div id="warning-message" class="alert alert-warning mt-3" style="display: none;"></div>
          <a href="{{ url_for('home') }}" class="btn btn-success btn-lg mt-3">Try Another Image</a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Custom JS for weight handling -->
{% if requires_weight %}
<script>
document.getElementById('submit-weight').addEventListener('click', function() {
    const weight = parseFloat(document.getElementById('weight-input').value);
    if (isNaN(weight) || weight < 0) {
        alert('Please enter a valid weight.');
        return;
    }
    const warningMessage = document.getElementById('warning-message');
    if (weight > 150) {
        warningMessage.textContent = 'It seems to have something in it, need to reclassify.';
        warningMessage.style.display = 'block';
    } else {
        warningMessage.style.display = 'none';
    }
});
</script>
{% endif %}

{% endblock %}
